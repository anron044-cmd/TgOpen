name: Build dylib
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -miphoneos-version-min=13.0 -fobjc-arc \
            -framework UIKit -framework Foundation \
            -install_name @rpath/TgOpen.dylib \
            Tweak.m -o TgOpen.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: TgOpen
          path: TgOpen.dylib
